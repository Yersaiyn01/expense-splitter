[project]
name = "expense-splitter"
version = "0.1.0"
requires-python = ">=3.10"
description = "Tiny CLI to track shared expenses and split them"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set so lint results do not depend on the machine's ruff defaults.
select = ["E", "F", "W", "I", "B", "BLE", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["BLE001"]   # probe scripts intentionally print any exception

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
